<!DOCTYPE html>
<html>

<head>
    <title>MEDDS Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="header">
    <h1>MEDDS</h1>
    <p>Multimodal Emotion & Distraction Detection System</p>
</div>

<div class="dashboard">

    <div class="camera-card">

        <h2>Live Camera Feed</h2>

        <div class="camera-container">
            <video id="webcam" autoplay playsinline></video>
        </div>
        
        <div class="audio-panel">

            <div class="mic-header">
                🎤 Microphone Active
            </div>

            <canvas id="audioVisualizer"></canvas>

        </div>

    </div>

    <div class="results">

        <div class="card emotion-card">

            <h3>🧠 Fusion Emotion</h3>

            <div id="finalEmotion">
                Waiting...
            </div>

            <div id="finalConfidence">
                0%
            </div>

        </div>

        <div class="card">

            <h3>📊 Top 3 Emotions</h3>

            <div id="topEmotion1">-</div>
            <div id="topEmotion2">-</div>
            <div id="topEmotion3">-</div>

        </div>

        <div class="card">

            <h3>🛡️ Spoof Detection</h3>

            <div id="spoofStatus">
                Waiting...
            </div>

        </div>

        <div class="card">

            <h3>🎯 Distraction</h3>

            <div id="distractionLevel">
                Waiting...
            </div>

            <div id="distractionScore">
                0%
            </div>

        </div>

    </div>

</div>

<canvas id="captureCanvas" style="display:none;"></canvas>

</body>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</html>
